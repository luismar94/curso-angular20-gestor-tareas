<main>
  <h1>{{ title }}</h1>
  <p class="contador">Pendientes: {{ store.pendientes() }}</p>

  <app-task-form (agregado)="store.agregar($event)" />

  <button class="cargar" (click)="store.cargarEjemplos()">Cargar ejemplos de la API</button>

  @if (store.cargando()) {
    <p class="estado">Cargando tareas...</p>
  }

  @if (store.error()) {
    <p class="estado error">{{ store.error() }}</p>
  }

  <ul>
    @for (tarea of store.tareas(); track tarea.id) {
      <app-task-item
        [task]="tarea"
        (toggled)="store.toggle($event)"
        (removed)="store.eliminar($event)"
      />
    } @empty {
      <li class="vacio">No hay tareas. Agrega una!!</li>
    }
  </ul>

  <button
    class="limpiar"
    (click)="store.limpiarCompletadas()"
    [disabled]="store.completadas() === 0"
  >
    Limpiar completadas ({{ store.completadas() }})
  </button>
</main>

<router-outlet />
